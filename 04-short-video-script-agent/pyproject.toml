[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "short-video-script-agent"
version = "0.1.0"
description = "短视频脚本 Agent（时长修正、素材事实、规则检查）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
short-video-script-agent = "script_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
