[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "content-planning-agent"
version = "0.1.0"
description = "内容任务规划 Agent（预算、截止时间、失败重规划、方案保存）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
content-planning-agent = "content_planner.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
