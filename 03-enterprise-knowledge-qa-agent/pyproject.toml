[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-knowledge-qa-agent"
version = "0.1.0"
description = "企业知识问答 Agent（引用校验、冲突追问、资料缺口）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
enterprise-knowledge-qa-agent = "knowledge_qa.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
